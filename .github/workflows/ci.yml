name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify build outputs
        run: |
          for f in build/index.js build/info.json build/gameart.png dist/vortex-farever-extension.zip; do
            if [ ! -f "$f" ]; then
              echo "::error::Build did not produce $f"
              exit 1
            fi
          done
